# Planted events (the answer key). Each is written to data/truth/planted_events.csv.
events:
  raw_material_price_increase: # event 1
    account_no: 2010
    cost_centre: Production
    from_period: "2026-06"
    increase: 0.08
  machine_repair: # event 2
    account_no: 4010
    cost_centre: Production
    period: "2026-09"
    amount_dkk: 350000
    supplier: Hydra-Service Danmark ApS
    text: "Invoice 48213, emergency repair hydraulic press line 2, parts and labour"
  energy_misposting: # event 3 - booked in full in this month, corrected the month after
    account_no: 4020
    cost_centre: Production
    period: "2026-07"
  key_customer_volume_cut: # event 4
    customer: Nordvik Maskinfabrik A/S
    from_period: "2026-07"
    cut: 0.25
  sick_leave_production: # event 5
    cost_centre: Production
    periods: ["2026-08", "2026-09"]
    overtime_account_no: 3020
    extra_overtime_dkk: 100000
    temporary_staff_account_no: 3030
    extra_temporary_staff_dkk: 200000
  unexplained_admin_overspend: # event 6
    account_no: 4090
    cost_centre: Administration
    period: "2026-09"
    extra_dkk: 120000
    transactions: 25

# AI draft comments (scripts/draft_comments.py).
ai:
  # Models to try, in order (see: python scripts/draft_comments.py --list-models).
  # When a model's free-tier quota is used up, it is not found, or it keeps failing after
  # retries, the run moves to the next. (gemini-2.5-flash and -lite are listed by the API
  # but returned 'not found' for this key, so they are not in the list.)
  models:
    - gemini-3.8-flash
    - gemini-3.7-flash
    - gemini-3.6-flash
    - gemini-3.5-flash
    - gemini-3.5-flash-lite
    - gemini-3.1-flash-lite
  temperature: 0.2
  max_calls_per_run: 100 # hard cap on API calls per run
  seconds_between_calls: 7 # about 8 calls a minute, inside the free-tier rate limit
  max_ledger_lines: 40 # largest lines shown to the model; the rest are summarised
  company_context: >-
    Odense Demo Manufacturing ApS (fictional), a Danish manufacturer of machined and welded
    components for industrial customers; revenue about DKK 120m, about 80 employees,
    fiscal year October-September.
